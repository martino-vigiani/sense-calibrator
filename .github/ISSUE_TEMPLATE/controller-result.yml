name: Controller result
description: Share measured results from a standard DualSense
title: "Controller result: "
body:
  - type: markdown
    attributes:
      value: |
        Real measurements help us understand where calibration works and where it does not. Do not include a controller serial number, USB path or another device identifier.
  - type: dropdown
    id: calibration
    attributes:
      label: Calibration used
      options:
        - Quick calibration
        - Guided calibration
        - Range calibration
        - Test only
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board revision
      description: Add it only if the tool displays it.
      placeholder: "For example: BDM-030"
    validations:
      required: false
  - type: textarea
    id: before
    attributes:
      label: Before
      description: Copy the drift, noise or precision measurements shown before calibration.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: Copy the same measurements after calibration.
    validations:
      required: true
  - type: dropdown
    id: saved
    attributes:
      label: Was the result written to controller memory?
      options:
        - No, temporary result only
        - Yes
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What changed?
      description: Mention stability, remaining drift and any error shown by the tool.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed controller serial numbers, USB paths and other device identifiers.
          required: true
