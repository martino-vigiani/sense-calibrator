# GitHub Pages usa Jekyll (main, /): non pubblicare strumenti e dati di sviluppo.
# Le risorse dell'app, le guide, gli asset social e le verifiche Google restano inclusi.
url: "https://martino-vigiani.github.io"
baseurl: "/sense-calibrator"

exclude:
  - ops
  - test
  - docs
  - scripts
  - server
  - data
  - node_modules
  - vendor
  - AGENTS.md
  - CLAUDE.md
  - package.json
  - README.md
  - ARTICLE.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  # Screenshot usato solo da ARTICLE.md (già escluso). THIRD_PARTY_NOTICES.md e
  # LICENSE restano pubblicati: il sito distribuisce codice derivato da
  # dualshock-tools (MIT) e la licenza deve accompagnarlo.
  - paper/assets/01-landing.png
